    (function () {
      const tl = gsap.timeline({ paused: true });

      // подпись 1 — пословно через размытие; кадр 0 уже читается

      const lineY = [0, 80, 138, 218];
      tl.fromTo("#mail-read", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.8);
      lineY.forEach((y, i) => {
        if (i === 0) return;
        tl.to("#mail-read", { y: y, duration: 0.35, ease: "power3.inOut" }, 0.8 + i * 0.75);
      });
      // на скрытой строке подсветка становится красной и растягивается на два ряда
      tl.to("#mail-read", { height: 116, background: "rgba(175,21,21,0.06)", borderLeftColor: "#af1515", duration: 0.3, ease: "power2.out" }, 4.3);
      tl.to("#mail-read", { opacity: 0, duration: 0.3 }, 5.0);

      // скрытая строка проявляется
      tl.fromTo("#mail-hidden-hatch", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 4.6);
      tl.fromTo("#mail-hidden-text", { color: "#ffffff" }, { color: "#af1515", duration: 0.5, ease: "power2.out" }, 4.65);

      // подпись 2
      tl.fromTo("#mail-cap2 .w", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, 4.85);

      // статус агента меняется: он начинает выполнять
      tl.set("#mail-agent-a", { display: "none" }, 7.4);
      tl.set("#mail-agent-b", { display: "inline" }, 7.4);
      tl.fromTo("#mail-agent", { scale: 1 }, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 7.4);

      // уход: зум сквозь скрытую строку в тёмный мир

      tl.fromTo("#mail-flood", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 10.1);

      window.__timelines["mail"] = tl;
