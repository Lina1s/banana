  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      const OFF = 4; // начало чтения письма

      tl.to("#mail-toast", { x: 720, duration: 0.35, ease: "power3.in" }, 1.95);
      tl.fromTo("#ib-new", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.25);
      tl.fromTo(".ib-old", { y: 0 }, { y: 112, duration: 0.5, ease: "expo.out" }, 1.2);
      tl.fromTo("#ib-new", { backgroundColor: "rgba(61,90,128,0.16)" }, { backgroundColor: "rgba(61,90,128,0.06)", duration: 1.2, ease: "power2.out" }, 1.25);
      tl.to("#mail-c12", { opacity: 0, y: -16, duration: 0.2 }, 1.3);
      tl.fromTo("#mail-c13", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, 1.35);
      tl.fromTo("#mail-cap0 .w", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, 1.0);
      tl.to("#mail-cap0 .w", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.03, ease: "power2.in" }, 3.3);
      // агент берёт письмо в работу и открывает его
      tl.set("#mail-agent-w", { display: "none" }, 2.3);
      tl.set("#mail-agent-o", { display: "inline" }, 2.3);
      tl.fromTo("#mail-agent", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 2.3);
      tl.to("#ib-new", { backgroundColor: "rgba(61,90,128,0.22)", duration: 0.1 }, 2.8);
      tl.to("#ib-dot", { scale: 0, duration: 0.2 }, 2.85);
      // строка раскрывается в открытое письмо
      tl.set("#mail-msg", { opacity: 1 }, 2.95);
      tl.to("#mail-msg", { clipPath: "inset(0px 0px 0px 0px)", duration: 0.6, ease: "power3.inOut" }, 2.95);
      tl.fromTo("#mail-msg", { backgroundColor: "#dfe5ee" }, { backgroundColor: "#ffffff", duration: 0.5, ease: "power2.in", immediateRender: false }, 3.15);
      tl.to("#mail-inbox", { opacity: 0, duration: 0.25 }, 3.4);
      tl.fromTo("#mail-msg > *", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 3.5);
      tl.set("#mail-msg > *", { opacity: 0 }, 0);
      tl.set("#mail-agent-o", { display: "none" }, OFF);
      tl.set("#mail-agent-a", { display: "inline" }, OFF);

      // подпись 1 — пословно через размытие; кадр 0 уже читается
      tl.fromTo("#mail-cap1 .w", { opacity: 0.25, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, OFF + 0.2);
      tl.to("#mail-cap1 .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.04, ease: "power2.in" }, OFF + 4.05);

      // агент читает: подсветка шагает по строкам тела письма
      const lineY = [0, 80, 138, 218];
      tl.fromTo("#mail-read", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, OFF + 0.8);
      lineY.forEach((y, i) => {
        if (i === 0) return;
        tl.to("#mail-read", { y: y, duration: 0.35, ease: "power3.inOut" }, OFF + 0.8 + i * 0.75);
      });
      // на скрытой строке подсветка становится красной и растягивается на два ряда
      tl.to("#mail-read", { height: 116, background: "rgba(175,21,21,0.06)", borderLeftColor: "#af1515", duration: 0.3, ease: "power2.out" }, OFF + 4.3);
      tl.to("#mail-read", { opacity: 0, duration: 0.3 }, OFF + 5.0);

      // скрытая строка проявляется
      tl.fromTo("#mail-hidden-hatch", { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, OFF + 4.6);
      tl.fromTo("#mail-hidden-text", { color: "#ffffff" }, { color: "#af1515", duration: 0.5, ease: "power2.out" }, OFF + 4.65);

      // подпись 2
      tl.fromTo("#mail-cap2 .w", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, OFF + 4.85);

      // статус агента меняется: он начинает выполнять
      tl.set("#mail-agent-a", { display: "none" }, OFF + 7.4);
      tl.set("#mail-agent-b", { display: "inline" }, OFF + 7.4);
      tl.fromTo("#mail-agent", { scale: 1 }, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, OFF + 7.4);

      // уход: зум сквозь скрытую строку в тёмный мир
      tl.to("#mail-cap2 .w", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.03, ease: "power2.in" }, OFF + 9.35);
      tl.to("#mail-cam", { scale: 5, transformOrigin: "47% 55%", filter: "blur(10px)", duration: 0.75, ease: "power3.in" }, OFF + 9.7);
      tl.fromTo("#mail-flood", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, OFF + 10.1);

      window.__timelines["mail"] = tl;
    })();
