  <script>
    (function () {
      document.querySelectorAll("#rw-panel .type").forEach((el) => {
        const txt = el.textContent;
        el.textContent = "";
        for (const ch of txt) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
      const tl = gsap.timeline({ paused: true });

      // перемотка: помехи, заголовок срывается, строки стираются с конца
      tl.fromTo("#rw-scan", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0);
      tl.fromTo("#rw-band", { opacity: 0, y: 900 }, { opacity: 1, y: -100, duration: 0.9, ease: "none" }, 0);
      tl.to("#rw-band", { y: 700, duration: 0.01 }, 0.95);
      tl.to("#rw-band", { y: -100, duration: 0.9, ease: "none" }, 0.96);
      tl.fromTo("#rw-title", { x: 0, opacity: 1 }, { x: -40, opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }, 0.05);
      tl.fromTo("#rw-cap", { x: 0, opacity: 1 }, { x: 30, opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 0.1);
      const clock = gsap.utils.toArray("#rw-clock span");
      clock.forEach((el, i) => {
        tl.set(el, { opacity: 1 }, 0.1 + i * 0.28);
        if (i < clock.length - 1) tl.set(el, { opacity: 0 }, 0.1 + (i + 1) * 0.28);
      });
      tl.fromTo("#rw-clock-label", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
      tl.to("#rw-r2", { opacity: 0, duration: 0.1 }, 0.3);
      const chars = gsap.utils.toArray("#rw-panel .ch").reverse();
      tl.to(chars, { opacity: 0, duration: 0.01, stagger: 1.3 / chars.length }, 0.35);
      tl.to("#rw-r1", { opacity: 0, duration: 0.1 }, 1.0);
      // файл возвращается и исчезает в CRM-запросе
      tl.fromTo("#rw-file", { x: 900, opacity: 1, filter: "blur(6px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.45);
      tl.to("#rw-file", { scale: 0.3, opacity: 0, duration: 0.3, ease: "power3.in" }, 1.25);
      tl.to(["#rw-clock", "#rw-clock-label"], { opacity: 0, duration: 0.2 }, 2.1);
      tl.to("#rw-scan", { opacity: 0, duration: 0.2 }, 2.1);

      // инструменты справа
      tl.fromTo(".tool", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, stagger: 0.08, ease: "expo.out" }, 2.2);
      // стена шлюза вырастает между агентом и инструментами
      tl.fromTo("#rw-line", { attr: { y2: 0 } }, { attr: { y2: 1080 }, duration: 0.7, ease: "power3.inOut" }, 2.5);
      const strands = gsap.utils.toArray("#rw-strands path");
      strands.forEach((p) => {
        const L = p.getTotalLength();
        gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
      });
      tl.to(strands, { strokeDashoffset: 0, duration: 1.0, stagger: 0.06, ease: "power2.inOut" }, 2.7);
      // глаз рисуется на стене
      const outline = document.getElementById("rw-outline");
      const oL = outline.getTotalLength();
      tl.fromTo(outline, { strokeDasharray: oL, strokeDashoffset: oL }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 3.1);
      tl.fromTo("#rw-eye", { scale: 0.85 }, { scale: 1, duration: 1.0, ease: "expo.out" }, 3.1);
      const spokes = gsap.utils.toArray(".rw-spokes line");
      const spokeEnds = spokes.map((l) => ({ x2: +l.getAttribute("x2"), y2: +l.getAttribute("y2") }));
      tl.fromTo(spokes, { attr: { x2: 100, y2: 100 } },
        { attr: (i) => spokeEnds[i], duration: 0.5, stagger: 0.04, ease: "expo.out" }, 3.5);
      tl.fromTo(".rw-rings path", { scale: 0, svgOrigin: "100 100" },
        { scale: 1, duration: 0.6, stagger: 0.1, ease: "expo.out" }, 3.7);
      tl.fromTo("#rw-pupil", { attr: { r: 0 } }, { attr: { r: 9 }, duration: 0.4, ease: "back.out(2)" }, 4.1);
      tl.to("#rw-line", { strokeOpacity: 0.35, duration: 0.4 }, 4.2);

      // имя — по буквам
      tl.fromTo("#rw-name .l", { opacity: 0.2, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.1, ease: "power2.out" }, 4.45);
      tl.fromTo("#rw-sub .w", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.07, ease: "power2.out" }, 5.25);
      // уход: подписи уходят, глаз и персонажи остаются для следующей сцены
      tl.to("#rw-sub .w", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.03, ease: "power2.in" }, 8.4);
      tl.to("#rw-name .l", { opacity: 0, filter: "blur(10px)", duration: 0.18, stagger: 0.03, ease: "power2.in" }, 8.45);
      tl.to(["#rw-line", "#rw-strands"], { opacity: 0, duration: 0.3 }, 8.6);

      window.__timelines["rewind"] = tl;
    })();
  </script>
