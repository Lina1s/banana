    <script>
      // Фирменные линии-волны: два пучка, детерминированно
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        function bundle(gid, x0, y0, x1, y1, bend, count, spread) {
          const g = document.getElementById(gid);
          for (let i = 0; i < count; i++) {
            const k = i / (count - 1);
            const off = (k - 0.5) * spread;
            const b = bend * (0.6 + 0.8 * k);
            const d =
              `M ${x0} ${y0 + off} C ${x0 + 520} ${y0 + off - b}, ${x1 - 640} ${y1 + off + b}, ${x1} ${y1 + off * 0.6}`;
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", d);
            p.setAttribute("fill", "none");
            p.setAttribute("stroke", "#d8322b");
            p.setAttribute("stroke-width", "1.2");
            p.setAttribute("stroke-opacity", (0.12 + 0.22 * Math.sin(k * Math.PI)).toFixed(3));
            g.appendChild(p);
          }
        }
        bundle("waves-a", -200, 120, 1100, -60, 260, 56, 340);
        bundle("waves-b", 900, 1160, 2150, 760, -300, 56, 360);
      })();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#waves-a", { x: -60, y: 0, rotation: -2, transformOrigin: "50% 50%" },
        { x: 60, y: 30, rotation: 2, duration: 98, ease: "none" }, 0);
      tl.fromTo("#waves-b", { x: 40, y: 0, rotation: 2, transformOrigin: "50% 50%" },
        { x: -70, y: -30, rotation: -2, duration: 98, ease: "none" }, 0);
      window.__timelines["main"] = tl;
